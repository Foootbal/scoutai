<!DOCTYPE html>
<html>
<head>
  <title>ScoutAI</title>
</head>
<body style="background:black;color:white;text-align:center;">

  <h1>ScoutAI ⚽</h1>

  <button onclick="upload()">Upload Video</button>

  <script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js'

const supabase = createClient(
  "https://qzcqvgdodfywjrcnzaxn.supabase.co",
  "PASTE_YOUR_SB_PUBLISHABLE_KEY_HERE"
)

alert("Supabase loaded")

async function upload() {
  alert("Upload started")

  const file = document.getElementById('fileInput').files[0]

  if (!file) {
    alert("Please choose a file first")
    return
  }

  alert("About to upload")

  const { data, error } = await supabase.storage
    .from('videos')
    .upload(`video-${Date.now()}.mp4`, file)

  alert("Upload request sent")

  if (error) {
    alert("ERROR: " + error.message)
    console.error(error)
  } else {
    alert("SUCCESS!")
    console.log(data)
  }
}

window.upload = upload
</script>

</body>
</html>
