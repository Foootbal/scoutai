<!DOCTYPE html>
<html>
<head>
  <title>ScoutAI</title>
</head>
<body style="background:black;color:white;text-align:center;">

  <h1>ScoutAI ⚽</h1>

  <input type="file" id="fileInput" />
  <button onclick="upload()">Upload Video</button>

  <video id="video" width="300" controls></video>

  <script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js'

const supabase = createClient(
  "https://qzcqvgdodfywjrcnzaxn.supabase.co",
  "YOUR_FULL_PUBLISHABLE_KEY"
)

async function upload() {
  alert("Button clicked!");

  const file = document.getElementById('fileInput').files[0]

  alert(file ? "File selected" : "No file selected");

  if (!file) {
    alert("Please choose a file first")
    return
  }
  }

  const { data, error } = await supabase.storage
    .from('videos')
    .upload(`video-${Date.now()}.mp4`, file)

  if (error) {
    alert(error.message)
    console.error(error)
  } else {
    alert("Upload successful!")
    console.log(data)
  }
}

window.upload = upload
</script>
